[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qlik-gateway"
version = "0.5.3"
description = "Buffer service between external schedulers (Airflow, platform teams) and Qlik Sense QRS API"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
    "prometheus-client>=0.20",
    "truststore>=0.9",
    "ldap3>=2.9",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
qlik-gateway = "qlik_gateway.cli:main"

[tool.setuptools.packages.find]
include = ["qlik_gateway*"]

[tool.setuptools.package-data]
qlik_gateway = ["templates/*.html", "static/*", "static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults

[tool.ruff.lint.isort]
known-third-party = ["airflow"]
known-first-party = ["qlik_gateway", "qlik_gateway_provider"]
