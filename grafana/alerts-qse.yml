# =====================================================================
# Правила алертов по Postgres, формат правил Prometheus.
#
# Импорт: Grafana -> Alerting -> Alert rules -> New alert rule ->
# выпадающий список рядом с кнопкой -> "Import to Grafana-managed
# rules" -> вставить этот файл.
#
# ПЕРЕД ИМПОРТОМ замени qse на значение метки pg_group из
# prometheus.yml. Своя копия файла на каждый набор хостов, импорт в
# РАЗНЫЕ папки Grafana. Без этого фильтра правила накроют все хосты
# разом, и разделить оповещения по командам будет нечем.
#
# ---------------------------------------------------------------------
# ПОСЛЕ ИМПОРТА, по одному разу на правило:
#
#   1. Contact point (Configure notifications -> контакт-поинт).
#   2. No data and error handling -> No data -> Normal ВЕЗДЕ, кроме
#      МониторингОслеп. Когда экспортёр падает, метрики исчезают у всех
#      правил сразу: при No data = Alerting прилетит тринадцать
#      уведомлений об одной поломке. Ловит её отдельное правило
#      МониторингОслеп, у него No data наоборот надо оставить Alerting.
#   3. Снять с паузы.
#
# ---------------------------------------------------------------------
# Пороги подписаны у каждого правила и подобраны так, чтобы не шуметь
# на старте. Два места, где их почти наверняка придётся двигать под
# DWH-нагрузку, отмечены словом ПОДКРУТИТЬ.
#
# ВАЖНО про `for`. Он не единственный таймер: у группы правил в Grafana
# свой интервал вычисления, по умолчанию 1 минута. При for: 10s алерт
# всё равно сработает не раньше следующего вычисления. Чтобы ловить за
# секунды, надо опустить и интервал группы, помня, что Prometheus
# скрейпит раз в 15 секунд и свежее этого данных нет в принципе.
# =====================================================================
groups:
  - name: postgres
    rules:

      # ===============================================================
      # ДОСТУПНОСТЬ
      # ===============================================================

      # pg_up и есть проверка "select 1": экспортёр держит соединение с
      # базой и на каждый скрейп выполняет в ней запросы. Не выполнил —
      # ноль. Отдельный healthcheck-скрипт поверх этого не нужен.
      - alert: БазаНеОтвечает
        expr: pg_up{pg_group="qse"} == 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "Postgres не отвечает: {{ $labels.pg_instance }}"
          description: >-
            Экспортёр работает на самом хосте БД и ходит в Postgres через
            localhost. Раз он не может подключиться и выполнить запрос —
            проблема в базе, а не в сети до неё. Сюда же попадает случай,
            когда слоты подключений кончились полностью: экспортёр тоже
            остаётся без слота.

      # Без этого правила все остальные могут молчать просто потому, что
      # данные перестали поступать. Молчащий мониторинг неотличим от
      # "всё хорошо", пока не спросишь.
      - alert: МониторингОслеп
        expr: up{pg_group="qse",job=~"postgres-exporter|node-exporter"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Не отвечает сборщик метрик {{ $labels.job }} ({{ $labels.instance }})"
          description: >-
            Prometheus не может опросить экспортёр. Пока это так, часть
            алертов по этой базе слепа. Единственное правило, которому
            No data надо оставить в Alerting.

      # ===============================================================
      # ПОДКЛЮЧЕНИЯ
      #
      # Счётчика отказов в подключении ("too many clients already") в
      # этих экспортёрах НЕТ — Postgres до 17 включительно такой счётчик
      # наружу не отдаёт, а pg_stat_database в 0.17.1 собирает только
      # numbackends/xact/blks/tup/temp/deadlocks/blk_*_time. Поэтому
      # отказы ловятся с двух сторон: заполненность слотов до того, как
      # они кончились, и pg_up == 0 после. Если нужен именно текст
      # ошибки из лога — это отдельная история, promtail или mtail на
      # postgresql.log, сюда не относится.
      # ===============================================================

      - alert: СлотыПодключенийНаИсходе
        expr: |
          sum by (pg_group, pg_instance) (pg_stat_activity_count{pg_group="qse"})
          / max by (pg_group, pg_instance) (pg_settings_max_connections{pg_group="qse"}) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Занято {{ $value | printf \"%.1f\" }}% слотов на {{ $labels.pg_instance }}"
          description: >-
            Запас по max_connections меньше 20%. Реальная стенка чуть
            ближе, чем кажется: superuser_reserved_connections держит
            последние несколько слотов, обычным клиентам их не дадут.
            Кто занял — на дашборде, панель «Кто занимает подключения»,
            разбита по пользователю и приложению. Частые причины: нет
            пула соединений либо сессии зависли в idle in transaction.
            for: 5m намеренно: короткие всплески до 80% при переподъёме
            пула — норма, авария это когда не отпускает.

      # Отдельно от предыдущего и от "база не отвечает": здесь новые
      # клиенты уже получают отказ, а pg_up ещё единица. Для приложения
      # это авария, для хелсчека — тишина.
      - alert: СлотыПодключенийИсчерпаны
        expr: |
          sum by (pg_group, pg_instance) (pg_stat_activity_count{pg_group="qse"})
          / max by (pg_group, pg_instance) (pg_settings_max_connections{pg_group="qse"}) * 100 > 95
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Слоты почти кончились на {{ $labels.pg_instance }}: {{ $value | printf \"%.1f\" }}%"
          description: >-
            Осталось меньше 5% от max_connections — часть клиентов уже
            получает отказ. Быстрое лечение: найти и снять зависшие
            сессии. SELECT pid, usename, application_name, state,
            now() - state_change AS age FROM pg_stat_activity
            WHERE state LIKE 'idle%' ORDER BY state_change LIMIT 20;

      # ===============================================================
      # ТРАНЗАКЦИИ
      #
      # backend_type="client backend" отсекает фоновые процессы самой
      # базы. Без него правило ловит autovacuum worker: он держит
      # открытую транзакцию столько, сколько чистит таблицу, usename у
      # него пустой (фоновым процессам пользователь не присвоен), и в
      # уведомлении получается "[no value] / [no value]". Уборка это не
      # зависшая транзакция, и будить по ней никого не надо. Застрявший
      # автовакуум — отдельная история, под неё у экспортёра есть
      # выключенный по умолчанию --collector.stat_activity_autovacuum.
      #
      # usename и application_name в by не для красоты: это максимум
      # того, что экспортёр знает о владельце транзакции. Ни pid, ни
      # текста запроса в метриках нет и быть не может — pg_stat_activity
      # приезжает уже свёрнутым в агрегат. Поэтому алерт отвечает на
      # вопрос "чьё", а "что именно" смотрится запросом из шаблона
      # уведомления.
      #
      # Два правила намеренно разведены по состоянию сессии, чтобы одна
      # проблема не давала два уведомления и чтобы имя алерта сразу
      # говорило, что чинить:
      #   idle in transaction -> приложение открыло транзакцию и забыло
      #                          закрыть, чинится в коде;
      #   active              -> запрос реально выполняется долго,
      #                          чинится планом и индексами.
      # ===============================================================

      - alert: ЗависшаяIdleInTransaction
        expr: |
          max by (pg_group, pg_instance, datname, usename, application_name) (
            pg_stat_activity_max_tx_duration{pg_group="qse",state=~"idle in transaction.*",backend_type="client backend"}
          ) > 120
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "idle in transaction на {{ $labels.pg_instance }} ({{ $labels.datname }}) держится {{ $value | humanizeDuration }} — {{ $labels.usename }} / {{ $labels.application_name }}"
          description: >-
            Сессия открыла транзакцию и ничего не делает. Пока она жива,
            автовакуум не может убрать мёртвые строки ПО ВСЕЙ базе, а не
            только в её таблицах — отсюда распухание таблиц, рост места
            на диске и медленное сползание horizon в сторону wraparound.
            Найти: SELECT pid, usename, application_name, client_addr,
            now() - state_change AS idle_age, left(query,200)
            FROM pg_stat_activity WHERE state LIKE 'idle in transaction%'
            ORDER BY state_change;
            Снять: pg_cancel_backend(pid), не помогло — pg_terminate_backend(pid).

      # Порог отдельно по хостам задаётся копией этого правила с
      # pg_instance= у исключения и pg_instance!= здесь, чтобы ни один
      # хост не попал под два правила сразу. Пример — в комплекте prod-dp.
      - alert: ДолгаяТранзакция
        expr: |
          max by (pg_group, pg_instance, datname, usename, application_name) (
            pg_stat_activity_max_tx_duration{pg_group="qse",state!~"idle.*",backend_type="client backend"}
          ) > 3600
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Запрос на {{ $labels.pg_instance }} ({{ $labels.datname }}) выполняется {{ $value | humanizeDuration }} — {{ $labels.usename }} / {{ $labels.application_name }}"
          description: >-
            Активная транзакция живёт больше часа. Последствия те же, что
            у idle in transaction — заблокированный автовакуум по всей
            базе, — но причина другая: это работающий запрос.
            Найти: SELECT pid, usename, application_name, state,
            now() - xact_start AS tx_age, wait_event_type, wait_event,
            left(query,300) FROM pg_stat_activity
            WHERE xact_start IS NOT NULL ORDER BY xact_start;

      # ===============================================================
      # БЛОКИРОВКИ
      #
      # Почему НЕ по pg_locks_count. Количество блокировок само по себе
      # ничего не значит: обычная OLTP-база держит их сотнями, DWH во
      # время загрузки — тысячами, и любой порог по количеству даёт либо
      # шум, либо тишину. Разделяет не количество, а ДЛИТЕЛЬНОСТЬ.
      #
      # Отсюда правило ниже: не "блокировок много", а "сессия непрерывно
      # ждёт чужую блокировку". Нормальное ожидание живёт миллисекунды и
      # не попадает даже в два скрейпа подряд; for: 2m требует, чтобы
      # условие держалось на КАЖДОМ вычислении внутри окна — один чистый
      # скрейп сбрасывает отсчёт. Пролезть может только по-настоящему
      # застрявший блокировщик.
      #
      # wait_event_type="Lock" — это тяжёлые блокировки уровня строк и
      # таблиц, то есть ожидание чужой транзакции. LWLock сюда не
      # попадает намеренно: это внутренние защёлки движка, они мелькают
      # постоянно и к прикладным блокировкам отношения не имеют.
      #
      # ПОДКРУТИТЬ, если зашумит: сначала for до 5m, потом порог с 0 до
      # 2-3 сессий. Порог поднимать вторым, а не первым: одна намертво
      # заблокированная сессия — это уже инцидент, просто короткие
      # ожидания не должны за неё отвечать.
      # ===============================================================

      # wait_event в by добавлен, а usename и application_name — нет, и
      # это осознанно. Здесь интересен БЛОКИРОВЩИК, а разбивка по меткам
      # размножила бы экземпляры по жертвам: двадцать вставших задач
      # дали бы двадцать строк в уведомлении, и ни одна не назвала бы
      # виновника. А вот wait_event говорит о природе затора и имеет
      # десяток возможных значений, то есть ничего не размножает:
      # transactionid — ждут чужую транзакцию (конфликт по строкам),
      # relation — ждут блокировку таблицы, обычно DDL или VACUUM FULL.
      - alert: СессииЖдутБлокировку
        expr: |
          sum by (pg_group, pg_instance, datname, wait_event) (
            pg_stat_activity_count{pg_group="qse",wait_event_type="Lock"}
          ) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} сессий ждут {{ $labels.wait_event }} на {{ $labels.pg_instance }} ({{ $labels.datname }}) больше 2 минут"
          description: >-
            Кто кого держит: SELECT blocked.pid AS blocked_pid,
            blocked.query AS blocked_query, blocking.pid AS blocking_pid,
            blocking.state, blocking.query AS blocking_query
            FROM pg_stat_activity blocked
            JOIN pg_stat_activity blocking
              ON blocking.pid = ANY(pg_blocking_pids(blocked.pid))
            WHERE cardinality(pg_blocking_pids(blocked.pid)) > 0;
            Разбирать надо блокировщика, а не жертву.

      # Единственное правило по блокировкам, у которого false positive
      # невозможен в принципе: взаимоблокировка это всегда дефект, база
      # уже убила одну из транзакций сама.
      - alert: Взаимоблокировки
        expr: |
          sum by (pg_group, pg_instance, datname) (
            increase(pg_stat_database_deadlocks{pg_group="qse"}[10m])
          ) > 0
        labels:
          severity: warning
        annotations:
          summary: "Взаимоблокировки на {{ $labels.pg_instance }} ({{ $labels.datname }}): {{ $value | printf \"%.0f\" }} за 10 минут"
          description: >-
            Две транзакции взяли одни и те же объекты в разном порядке.
            Postgres разорвал цикл, откатив одну из них — то есть кто-то
            уже получил ошибку. Подробности только в логе базы, метрика
            даёт лишь факт: grep deadlock в postgresql.log.

      # ===============================================================
      # ХОСТ
      # ===============================================================

      # ПОДКРУТИТЬ. На DWH-хосте загрузка CPU в полку во время загрузки
      # данных — это норма, а не авария, и по одному только проценту CPU
      # отличить штатный ETL от аварии нельзя. Поэтому for: 15m и
      # severity warning, а не critical: правило отвечает на вопрос
      # "процессор занят непрерывно уже четверть часа", не более того.
      # Если и так шумит, разумная замена — очередь, а не проценты:
      #   node_load5 / count by (pg_group,pg_instance) (node_cpu_seconds_total{mode="idle"}) > 1.5
      # Она растёт только когда задачи реально стоят в очереди.
      - alert: ЗагрузкаCPU
        expr: |
          100 - avg by (pg_group, pg_instance) (
            rate(node_cpu_seconds_total{pg_group="qse",mode="idle"}[5m])
          ) * 100 > 80
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "CPU на {{ $labels.pg_instance }} занят на {{ $value | printf \"%.0f\" }}% уже 15 минут"
          description: >-
            Смотреть на дашборде «Загрузка CPU по режимам»: если растёт
            iowait — упирается не процессор, а диск, и чинить надо не
            запросы. Если растёт user — это запросы, дальше в
            «Активные сессии» и pg_stat_statements.

      # mountpoint перечислены явно. Без фильтра правило ловит /boot,
      # /var/log/audit и прочее, которые живут на 85-90% годами, и
      # быстро превращается в шум, который перестают читать. Лишние
      # строки в списке безвредны: чего нет, то просто не совпадёт.
      # Свои тома проверить: curl -s ХОСТ:9100/metrics | grep node_filesystem_size_bytes
      - alert: ДискБазыКончается
        expr: |
          (1 - node_filesystem_avail_bytes{pg_group="qse",fstype!~"tmpfs|overlay|squashfs",mountpoint=~"/|/data_db|/mwal|/pg_log|/pgdata|/var/lib/pgsql"}
             / node_filesystem_size_bytes{pg_group="qse",fstype!~"tmpfs|overlay|squashfs",mountpoint=~"/|/data_db|/mwal|/pg_log|/pgdata|/var/lib/pgsql"}) * 100 > 80
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.mountpoint }} на {{ $labels.pg_instance }} занят на {{ $value | printf \"%.1f\" }}% (свободно меньше 20%)"
          description: >-
            Переполнение тома останавливает запись в Postgres мгновенно —
            это не деградация, а стоп. /data_db данные, /mwal WAL.
            Растущий /mwal при живой базе почти всегда означает
            застрявший слот репликации или сломанный archive_command:
            SELECT slot_name, active, restart_lsn FROM pg_replication_slots;

      # ===============================================================
      # ЗАДЕРЖКИ ВВОДА-ВЫВОДА
      #
      # Честно про p95/p99: их здесь взять НЕ ИЗ ЧЕГО. Ни node_exporter,
      # ни postgres_exporter не отдают гистограмм по времени операций —
      # только счётчики суммарного времени и количества. Из них считается
      # СРЕДНЕЕ за окно, и ничего кроме среднего. Что дало бы перцентили,
      # написано в README рядом с этими правилами.
      #
      # Среднее при этом ловит ровно то, ради чего перцентили и просили:
      # деградацию хранилища. Хвост оно смазывает, полку — нет.
      #
      # Делитель не защищён от нуля намеренно: на простое 0/0 даёт NaN,
      # NaN сравнение не проходит, правило молчит. Само по себе тут это
      # не критично — с порогом "больше" ноль от clamp_min тоже не
      # прошёл бы. Важно не тащить привычку подстраховывать делитель
      # туда, где порог "меньше": в доле попаданий в кэш или в доле
      # успешных коммитов clamp_min превращает простаивающую базу в
      # ноль, ноль проходит сравнение, и алерт кричит на пустом месте.
      # ===============================================================

      - alert: ЗадержкаДискаЧтение
        expr: |
          rate(node_disk_read_time_seconds_total{pg_group="qse",device=~"sd.*|nvme.*|vd.*|xvd.*"}[5m])
          / rate(node_disk_reads_completed_total{pg_group="qse",device=~"sd.*|nvme.*|vd.*|xvd.*"}[5m]) > 0.02
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Чтение с {{ $labels.device }} на {{ $labels.pg_instance }} занимает {{ $value | humanizeDuration }} на операцию"
          description: >-
            Среднее время обслуживания операции чтения держится выше 20 мс
            десять минут подряд. Для SSD это в 10-20 раз выше нормы, для
            HDD под нагрузкой уже за гранью. Причина обычно снаружи базы:
            соседи по массиву, деградировавший RAID, упавший кеш
            контроллера на запись.

      - alert: ЗадержкаДискаЗапись
        expr: |
          rate(node_disk_write_time_seconds_total{pg_group="qse",device=~"sd.*|nvme.*|vd.*|xvd.*"}[5m])
          / rate(node_disk_writes_completed_total{pg_group="qse",device=~"sd.*|nvme.*|vd.*|xvd.*"}[5m]) > 0.02
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Запись на {{ $labels.device }} на {{ $labels.pg_instance }} занимает {{ $value | humanizeDuration }} на операцию"
          description: >-
            Медленная запись бьёт по Postgres сильнее медленного чтения:
            на ней стоят fsync WAL и чекпоинты, то есть коммиты. Проверить
            на дашборде «Чекпоинты»: досрочные (req) вместо плановых
            (timed) — признак, что база не успевает.

      # Взгляд со стороны базы, а не устройства: сюда попадает и задержка
      # самого хранилища, и промахи мимо кеша ОС.
      #
      # ТРЕБУЕТ track_io_timing = on. Выключен — метрика остаётся нулём,
      # и правило молчит навсегда, ничем это не показывая. Проверить
      # один раз: SHOW track_io_timing;  Включить без перезапуска:
      # ALTER SYSTEM SET track_io_timing = on; SELECT pg_reload_conf();
      # Накладные расходы на современном ядре околонулевые.
      - alert: МедленноеЧтениеБлоков
        expr: |
          rate(pg_stat_database_blk_read_time{pg_group="qse"}[5m])
          / rate(pg_stat_database_blks_read{pg_group="qse"}[5m]) > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Чтение блока в {{ $labels.datname }} на {{ $labels.pg_instance }} занимает {{ $value | printf \"%.1f\" }} мс"
          description: >-
            Postgres ждёт диск дольше 5 мс на блок. Если параллельно молчат
            ЗадержкаДиска* — значит, устройство здорово, а база просто
            перестала попадать в кеш: смотреть «Попадания в кэш» и
            shared_buffers. Если они кричат вместе — проблема в хранилище.

      # ===============================================================
      # РЕПЛИКАЦИЯ
      #
      # pg_replication_lag_seconds устроен так, что на мастере он равен
      # нулю по построению (там pg_is_in_recovery() = false), и на
      # догнавшей реплике тоже ноль. Поэтому отдельная проверка "а это
      # точно standby" не нужна: ненулевым он бывает только на реально
      # отстающей реплике.
      # ===============================================================

      - alert: ОтставаниеРеплики
        expr: pg_replication_lag_seconds{pg_group="qse"} > 60
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Реплика {{ $labels.pg_instance }} отстаёт на {{ $value | humanizeDuration }}"
          description: >-
            Отставание больше минуты. При переключении столько данных и
            потеряется. Смотреть на мастере: SELECT client_addr, state,
            write_lag, flush_lag, replay_lag FROM pg_stat_replication;
            Частые причины — реплика упёрлась в диск или в CPU на
            применении WAL, либо сеть между площадками.

      # ---------------------------------------------------------------
      # Слепое пятно, которое НЕ закрывает правило выше, и включать его
      # надо осознанно.
      #
      # Если на standby умер walreceiver, receive_lsn перестаёт ехать и
      # становится равен replay_lsn — а при их равенстве лаг по
      # построению равен нулю. То есть полностью оборванная репликация
      # выглядит как идеально здоровая.
      #
      # Ловится это через last_replay_seconds, который растёт всегда. Но
      # он растёт и когда мастер просто простаивает и применять нечего.
      # Поэтому: включать там, где мастер пишет круглосуточно; на базах
      # с ночным затишьем будет ложно срабатывать каждую ночь.
      #
      # Надёжная альтернатива — следить со стороны МАСТЕРА за слотами:
      # запустить там экспортёр с --collector.replication_slot (по
      # умолчанию коллектор выключен) и повесить правило на
      # pg_replication_slot_slot_is_active == 0.
      #
      # - alert: РепликацияОстановилась
      #   expr: |
      #     pg_replication_last_replay_seconds{pg_group="qse"} > 300
      #     and on (pg_group, pg_instance) pg_replication_is_replica{pg_group="qse"} == 1
      #   for: 5m
      #   labels:
      #     severity: critical
      #   annotations:
      #     summary: "Реплика {{ $labels.pg_instance }} ничего не применяла {{ $value | humanizeDuration }}"
      #     description: >-
      #       Либо оборвалась репликация, либо мастер простаивает.
      #       На standby: SELECT * FROM pg_stat_wal_receiver;
      #       Пусто — walreceiver мёртв, это авария.
      # ---------------------------------------------------------------
