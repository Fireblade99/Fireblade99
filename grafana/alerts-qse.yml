# =====================================================================
# Пять алертов в формате правил Prometheus.
#
# Два способа применить:
#
#   1. Grafana 11.2+ : Alerting -> Alert rules -> New alert rule ->
#      выпадающий список рядом с кнопкой -> "Import to Grafana-managed
#      rules" -> вставить этот файл. Grafana сама переведёт их в свой
#      формат, и дальше они редактируются в UI как обычные.
#
#   2. Более старая Grafana: используй Import-GrafanaAlerts.ps1 —
#      он создаёт правила через API.
#
# ПЕРЕД ИМПОРТОМ: замени qse на значение метки pg_group из
# prometheus.yml. Для каждого набора хостов — своя копия этого файла со
# своим значением, и импортировать их надо в РАЗНЫЕ папки Grafana.
#
# Без этого фильтра правила накроют все хосты разом, и разделить
# оповещения по командам или по критичности будет нечем.
#
# Пороги подписаны у каждого правила. Это отправная точка, а не истина:
# под свою нагрузку их надо будет подвинуть.
#
# ВАЖНО про `for`. Он не единственный таймер: у группы правил в Grafana
# есть свой интервал вычисления, по умолчанию 1 минута. При for: 10s
# алерт всё равно сработает не раньше следующего вычисления, то есть
# примерно через минуту. Чтобы ловить действительно за секунды, надо
# опустить и интервал вычисления группы (Evaluation group -> interval),
# помня, что Prometheus скрейпит раз в 15 секунд и свежее этого данных
# нет в принципе.
# =====================================================================
groups:
  - name: postgres
    rules:

      # -----------------------------------------------------------------
      - alert: БазаНеОтвечает
        expr: pg_up{pg_group="qse"} == 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "Postgres не отвечает: {{ $labels.pg_instance }}"
          description: >-
            Экспортёр работает на самом хосте БД и ходит в Postgres через
            localhost. Раз он не может подключиться — проблема в базе,
            а не в сети до неё.

      # -----------------------------------------------------------------
      # Отдельно от «база не отвечает» намеренно: когда слоты кончаются,
      # новые клиенты получают отказ, а pg_up остаётся единицей. Для
      # приложения это авария, для хелсчека — тишина.
      # pg_group в by не для красоты: без неё агрегация съедает метку,
      # и у сработавшего алерта её не остаётся — маршрутизировать
      # уведомления по группе станет нечем.
      - alert: СлотыПодключенийНаИсходе
        expr: |
          sum by (pg_group, pg_instance) (pg_stat_activity_count{pg_group="qse"})
          / max by (pg_group, pg_instance) (pg_settings_max_connections{pg_group="qse"}) * 100 > 90
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Занято {{ $value | printf \"%.1f\" }}% слотов на {{ $labels.pg_instance }}"
          description: >-
            Осталось меньше 10% от max_connections. Кто занял — видно на
            дашборде в панели «Кто занимает подключения»: она разбита по
            пользователю и приложению. Частые причины — приложение без
            пула соединений либо сессии, зависшие в idle in transaction.

      # -----------------------------------------------------------------
      # Фильтр по mountpoint обязателен. Без него правило ловит /boot и
      # /var/log/audit и быстро превращается в шум, который перестают
      # читать.
      - alert: ДискБазыКончается
        expr: |
          (1 - node_filesystem_avail_bytes{pg_group="qse",mountpoint=~"/data_db|/mwal"}
             / node_filesystem_size_bytes{pg_group="qse",mountpoint=~"/data_db|/mwal"}) * 100 > 85
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.mountpoint }} на {{ $labels.pg_instance }} занят на {{ $value | printf \"%.1f\" }}%"
          description: >-
            Переполнение тома останавливает запись в Postgres мгновенно —
            это не деградация, а стоп. /data_db — данные, /mwal — WAL.
            Растущий /mwal при живой базе почти всегда означает
            застрявший слот репликации или сломанный archive_command.

      # -----------------------------------------------------------------
      - alert: ДолгаяТранзакция
        expr: max by (pg_group, pg_instance) (pg_stat_activity_max_tx_duration{pg_group="qse"}) > 3600
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Транзакция на {{ $labels.pg_instance }} открыта {{ $value | humanizeDuration }}"
          description: >-
            Долгая транзакция удерживает старые версии строк и блокирует
            автовакуум ПО ВСЕЙ базе, а не только в своей таблице. Отсюда
            потом растут и распухание таблиц, и расход места на диске.
            Найти: SELECT pid, usename, state, xact_start, query
            FROM pg_stat_activity ORDER BY xact_start;

      # -----------------------------------------------------------------
      # Без этого правила все четыре выше могут молчать просто потому,
      # что данные перестали поступать. Молчащий мониторинг неотличим от
      # «всё хорошо», пока не спросишь.
      - alert: МониторингОслеп
        expr: up{pg_group="qse",job=~"postgres-exporter|node-exporter"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Не отвечает сборщик метрик {{ $labels.job }} ({{ $labels.instance }})"
          description: >-
            Prometheus не может опросить экспортёр. Пока это так, часть
            алертов по этой базе слепа.
