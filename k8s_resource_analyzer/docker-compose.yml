services:
  k8s-analyzer:
    build: .
    image: k8s-resource-analyzer:latest
    container_name: k8s-resource-analyzer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: "UTC"                 # set your time zone for times in the Excel file
      # WEB_USER: admin         # uncomment to enable basic auth
      # WEB_PASSWORD: change-me
      # Corporate proxy env vars are ignored for VictoriaMetrics (prometheus.use_proxy: false)
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - analyzer-data:/data

volumes:
  analyzer-data:
