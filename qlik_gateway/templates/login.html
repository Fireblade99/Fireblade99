{% extends "base.html" %}{% block content %}
<div class="card" style="max-width:380px;margin:80px auto">
<h1>Qlik Gateway — вход</h1>
<form method="post" action="/ui/login"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="next" value="{{ next }}">
<label>Логин</label><input type="text" name="username" autofocus required>
<label>Пароль</label><input type="password" name="password" required>
<p><button class="primary">Войти</button></p></form></div>
{% endblock %}
