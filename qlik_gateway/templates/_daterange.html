{# one calendar for a date range; fills hidden date_from/date_to (UI time zone) #}
<div class="daterange"><label>Период</label>
 <span class="daterange-box"><input type="text" class="js-range" placeholder="все даты" readonly>
 <button type="button" class="js-range-clear" title="сбросить период">×</button></span>
 <input type="hidden" name="date_from" value="{{ f.date_from }}"><input type="hidden" name="date_to" value="{{ f.date_to }}">
</div>
