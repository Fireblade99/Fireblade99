{% extends "base.html" %}{% block content %}
<h1>Запуски</h1>
<form class="filters" method="get">
<div><label>Клиент</label><select name="client_id"><option value="">все</option>{% for c in clients %}<option value="{{ c.id }}" {% if f.client_id == c.id|string %}selected{% endif %}>{{ c.name }}</option>{% endfor %}</select></div>
<div><label>Статус</label><select name="status"><option value="">все</option>{% for s in statuses %}<option {% if f.status == s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></div>
<div><label>Задача (имя/ID)</label><input type="text" name="task" value="{{ f.task }}"></div>
<div><label>Инициатор (dag, run…)</label><input type="text" name="initiator" value="{{ f.initiator }}"></div>
<div><button class="primary">Найти</button></div></form>
<div class="table-wrap"><table>{% include "_exec_head.html" %}
{% for e in rows %}{% include "_exec_row.html" %}{% else %}<tr><td colspan="9" class="muted">Ничего не найдено</td></tr>{% endfor %}
</table></div>
<p>{% if page > 1 %}<a href="?client_id={{ f.client_id }}&status={{ f.status }}&task={{ f.task }}&initiator={{ f.initiator }}&page={{ page-1 }}">← назад</a>{% endif %}
{% if has_next %}<a href="?client_id={{ f.client_id }}&status={{ f.status }}&task={{ f.task }}&initiator={{ f.initiator }}&page={{ page+1 }}" style="float:right">дальше →</a>{% endif %}</p>
{% endblock %}
