# =====================================================================
# Юнит-тесты правил алертов.
#
#   promtool test rules prometheus/tests/alerts_test.yml
#
# Лежит ОТДЕЛЬНО от rules/ намеренно: Prometheus грузит rules/*.yml по
# маске, и тест-файл в той же папке уронил бы ему старт.
#
# Проверяем не только «алерт сработал», но и «НЕ сработал, когда не
# должен». Ложные срабатывания приводят к тому, что алерты начинают
# игнорировать — это хуже их отсутствия.
# =====================================================================

rule_files:
  - ../rules/postgres.recording.yml
  - ../rules/postgres.alerts.yml

evaluation_interval: 30s

tests:

  # ===================================================================
  # ДОСТУПНОСТЬ: три разных диагноза по двум наблюдателям
  # ===================================================================
  - interval: 30s
    name: "база не отвечает локально -> PostgresDown"
    input_series:
      - series: 'pg_up{pg_instance="db1",job="postgres-exporter"}'
        values: "0+0x40"
    promql_expr_test:
      - expr: 'ALERTS{alertname="PostgresDown",alertstate="firing"}'
        eval_time: 30s          # for: 1m ещё не выдержан
        exp_samples: []
      - expr: 'ALERTS{alertname="PostgresDown",alertstate="firing"}'
        eval_time: 2m
        exp_samples:
          - labels: 'ALERTS{alertname="PostgresDown", alertstate="firing", job="postgres-exporter", pg_instance="db1", severity="critical"}'
            value: 1

  # Ключевой диагноз, ради которого держим двух наблюдателей: экспортёр
  # на хосте базу видит, а мы — нет. Это сеть, а не база.
  - interval: 30s
    name: "экспортёр видит базу, пробер нет -> PostgresUnreachable"
    input_series:
      - series: 'pgprobe_up{pg_instance="db1",job="pg-probe"}'
        values: "0+0x40"
      - series: 'pg_up{pg_instance="db1",job="postgres-exporter"}'
        values: "1+0x40"
      - series: 'up{pg_instance="db1",job="postgres-exporter"}'
        values: "1+0x40"
    promql_expr_test:
      - expr: 'ALERTS{alertname="PostgresUnreachable",alertstate="firing"}'
        eval_time: 5m
        exp_samples:
          - labels: 'ALERTS{alertname="PostgresUnreachable", alertstate="firing", job="pg-probe", pg_instance="db1", severity="critical"}'
            value: 1
      # Сама база жива — PostgresDown обязан молчать
      - expr: 'ALERTS{alertname="PostgresDown",alertstate="firing"}'
        eval_time: 5m
        exp_samples: []

  - interval: 30s
    name: "лежит весь хост -> PostgresHostDown, а не Unreachable"
    input_series:
      - series: 'pgprobe_up{pg_instance="db1",job="pg-probe"}'
        values: "0+0x40"
      - series: 'up{pg_instance="db1",job="postgres-exporter"}'
        values: "0+0x40"
    promql_expr_test:
      - expr: 'ALERTS{alertname="PostgresHostDown",alertstate="firing"}'
        eval_time: 5m
        exp_samples:
          - labels: 'ALERTS{alertname="PostgresHostDown", alertstate="firing", job="pg-probe", pg_instance="db1", severity="critical"}'
            value: 1
      # pg_up отсутствует, значит "база жива" неверно -> Unreachable молчит
      - expr: 'ALERTS{alertname="PostgresUnreachable",alertstate="firing"}'
        eval_time: 5m
        exp_samples: []

  - interval: 30s
    name: "всё в порядке -> тишина по доступности"
    input_series:
      - series: 'pgprobe_up{pg_instance="db1",job="pg-probe"}'
        values: "1+0x40"
      - series: 'pg_up{pg_instance="db1",job="postgres-exporter"}'
        values: "1+0x40"
      - series: 'up{pg_instance="db1",job="postgres-exporter"}'
        values: "1+0x40"
    promql_expr_test:
      - expr: 'ALERTS{alertname=~"Postgres(Down|Unreachable|HostDown)",alertstate="firing"}'
        eval_time: 10m
        exp_samples: []

  # ===================================================================
  # НАСЫЩЕНИЕ ПО КОННЕКТАМ (проверяет и суммирование по state)
  # ===================================================================
  - interval: 30s
    name: "95 из 100 слотов -> critical"
    input_series:
      - series: 'pg_stat_activity_count{pg_instance="db1",job="postgres-exporter",datname="appdb",state="active",usename="app"}'
        values: "60+0x40"
      - series: 'pg_stat_activity_count{pg_instance="db1",job="postgres-exporter",datname="appdb",state="idle",usename="app"}'
        values: "35+0x40"
      - series: 'pg_settings_max_connections{pg_instance="db1",job="postgres-exporter"}'
        values: "100+0x40"
    promql_expr_test:
      - expr: 'pg:connections:utilization'
        eval_time: 5m
        exp_samples:
          - labels: 'pg:connections:utilization{pg_instance="db1"}'
            value: 0.95
      - expr: 'ALERTS{alertname="PostgresConnectionsCritical",alertstate="firing"}'
        eval_time: 5m
        exp_samples:
          - labels: 'ALERTS{alertname="PostgresConnectionsCritical", alertstate="firing", pg_instance="db1", severity="critical"}'
            value: 1

  - interval: 30s
    name: "50 из 100 слотов -> тишина"
    input_series:
      - series: 'pg_stat_activity_count{pg_instance="db1",job="postgres-exporter",datname="appdb",state="idle",usename="app"}'
        values: "50+0x40"
      - series: 'pg_settings_max_connections{pg_instance="db1",job="postgres-exporter"}'
        values: "100+0x40"
    promql_expr_test:
      - expr: 'ALERTS{alertname=~"PostgresConnections.*",alertstate="firing"}'
        eval_time: 10m
        exp_samples: []

  # ===================================================================
  # ВРЕМЯ ОТКЛИКА: гистограмма -> перцентиль -> алерт
  # ===================================================================
  - interval: 30s
    name: "медленный отклик -> PostgresSlowResponse"
    input_series:
      # все наблюдения в корзине (0.25, 0.5] -> p95 ~ 0.4875 c
      - series: 'pgprobe_session_ping_seconds_bucket{le="0.25",pg_instance="db1",job="pg-probe"}'
        values: "0+0x60"
      - series: 'pgprobe_session_ping_seconds_bucket{le="0.5",pg_instance="db1",job="pg-probe"}'
        values: "0+10x60"
      - series: 'pgprobe_session_ping_seconds_bucket{le="+Inf",pg_instance="db1",job="pg-probe"}'
        values: "0+10x60"
    promql_expr_test:
      - expr: 'pg:session_ping:p95'
        eval_time: 15m
        exp_samples:
          - labels: 'pg:session_ping:p95{pg_instance="db1"}'
            value: 0.48750000000000004
      - expr: 'ALERTS{alertname="PostgresSlowResponse",alertstate="firing"}'
        eval_time: 15m
        exp_samples:
          - labels: 'ALERTS{alertname="PostgresSlowResponse", alertstate="firing", pg_instance="db1", severity="warning"}'
            value: 1

  - interval: 30s
    name: "быстрый отклик -> тишина"
    input_series:
      - series: 'pgprobe_session_ping_seconds_bucket{le="0.005",pg_instance="db1",job="pg-probe"}'
        values: "0+10x60"
      - series: 'pgprobe_session_ping_seconds_bucket{le="+Inf",pg_instance="db1",job="pg-probe"}'
        values: "0+10x60"
    promql_expr_test:
      - expr: 'ALERTS{alertname=~"PostgresSlowResponse|PostgresVerySlowResponse",alertstate="firing"}'
        eval_time: 15m
        exp_samples: []

  # Смысл алерта — в разделении причин. Если бы он срабатывал и когда
  # медленно всё, он дублировал бы PostgresSlowResponse.
  - interval: 30s
    name: "коннект медленный, сервер быстрый -> PostgresSlowConnect"
    input_series:
      - series: 'pgprobe_connect_seconds_bucket{le="1",pg_instance="db1",job="pg-probe"}'
        values: "0+0x60"
      - series: 'pgprobe_connect_seconds_bucket{le="2.5",pg_instance="db1",job="pg-probe"}'
        values: "0+10x60"
      - series: 'pgprobe_connect_seconds_bucket{le="+Inf",pg_instance="db1",job="pg-probe"}'
        values: "0+10x60"
      - series: 'pgprobe_session_ping_seconds_bucket{le="0.005",pg_instance="db1",job="pg-probe"}'
        values: "0+10x60"
      - series: 'pgprobe_session_ping_seconds_bucket{le="+Inf",pg_instance="db1",job="pg-probe"}'
        values: "0+10x60"
    promql_expr_test:
      - expr: 'ALERTS{alertname="PostgresSlowConnect",alertstate="firing"}'
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="PostgresSlowConnect", alertstate="firing", pg_instance="db1", severity="warning"}'
            value: 1

  - interval: 30s
    name: "медленно вообще всё -> SlowConnect молчит (другой диагноз)"
    input_series:
      - series: 'pgprobe_connect_seconds_bucket{le="1",pg_instance="db1",job="pg-probe"}'
        values: "0+0x60"
      - series: 'pgprobe_connect_seconds_bucket{le="2.5",pg_instance="db1",job="pg-probe"}'
        values: "0+10x60"
      - series: 'pgprobe_connect_seconds_bucket{le="+Inf",pg_instance="db1",job="pg-probe"}'
        values: "0+10x60"
      - series: 'pgprobe_session_ping_seconds_bucket{le="0.5",pg_instance="db1",job="pg-probe"}'
        values: "0+0x60"
      - series: 'pgprobe_session_ping_seconds_bucket{le="1",pg_instance="db1",job="pg-probe"}'
        values: "0+10x60"
      - series: 'pgprobe_session_ping_seconds_bucket{le="+Inf",pg_instance="db1",job="pg-probe"}'
        values: "0+10x60"
    promql_expr_test:
      - expr: 'ALERTS{alertname="PostgresSlowConnect",alertstate="firing"}'
        eval_time: 20m
        exp_samples: []

  # ===================================================================
  # WRAPAROUND — проверяет и join group_left между двумя метриками
  # ===================================================================
  - interval: 30s
    name: "возраст транзакций 80% от порога -> предупреждение"
    input_series:
      - series: 'pgprobe_xid_age{datname="appdb",pg_instance="db1",job="pg-probe"}'
        values: "160000000+0x80"
      - series: 'pgprobe_xid_age_limit{pg_instance="db1",job="pg-probe"}'
        values: "200000000+0x80"
    promql_expr_test:
      - expr: 'pg:wraparound:ratio'
        eval_time: 40m
        exp_samples:
          - labels: 'pg:wraparound:ratio{datname="appdb", job="pg-probe", pg_instance="db1"}'
            value: 0.8
      - expr: 'ALERTS{alertname="PostgresXidWraparoundApproaching",alertstate="firing"}'
        eval_time: 40m
        exp_samples:
          - labels: 'ALERTS{alertname="PostgresXidWraparoundApproaching", alertstate="firing", datname="appdb", job="pg-probe", pg_instance="db1", severity="warning"}'
            value: 1

  # ===================================================================
  # CACHE HIT — регрессия на деление 0/0
  # ===================================================================
  # Раньше знаменатель поднимался до 1 через clamp_min: на простое
  # отношение выходило ровно 0 и алерт «< 95%» срабатывал на ровном
  # месте. Теперь 0/0 = NaN, сравнение не проходит, алерт молчит.
  - interval: 30s
    name: "база простаивает -> cache hit не определён, ложного алерта нет"
    input_series:
      - series: 'pg_stat_database_blks_hit{datname="appdb",pg_instance="db1",job="postgres-exporter"}'
        values: "1000+0x80"
      - series: 'pg_stat_database_blks_read{datname="appdb",pg_instance="db1",job="postgres-exporter"}'
        values: "10+0x80"
    promql_expr_test:
      - expr: 'ALERTS{alertname="PostgresLowCacheHitRatio",alertstate="firing"}'
        eval_time: 40m
        exp_samples: []

  - interval: 30s
    name: "трафик есть, попаданий 50% -> алерт"
    input_series:
      - series: 'pg_stat_database_blks_hit{datname="appdb",pg_instance="db1",job="postgres-exporter"}'
        values: "0+50x80"
      - series: 'pg_stat_database_blks_read{datname="appdb",pg_instance="db1",job="postgres-exporter"}'
        values: "0+50x80"
    promql_expr_test:
      - expr: 'pg:cache:hit_ratio'
        eval_time: 40m
        exp_samples:
          - labels: 'pg:cache:hit_ratio{pg_instance="db1"}'
            value: 0.5
      - expr: 'ALERTS{alertname="PostgresLowCacheHitRatio",alertstate="firing"}'
        eval_time: 40m
        exp_samples:
          - labels: 'ALERTS{alertname="PostgresLowCacheHitRatio", alertstate="firing", pg_instance="db1", severity="warning"}'
            value: 1

  - interval: 30s
    name: "трафик есть, попаданий 99% -> тишина"
    input_series:
      - series: 'pg_stat_database_blks_hit{datname="appdb",pg_instance="db1",job="postgres-exporter"}'
        values: "0+99x80"
      - series: 'pg_stat_database_blks_read{datname="appdb",pg_instance="db1",job="postgres-exporter"}'
        values: "0+1x80"
    promql_expr_test:
      - expr: 'ALERTS{alertname="PostgresLowCacheHitRatio",alertstate="firing"}'
        eval_time: 40m
        exp_samples: []

  # ===================================================================
  # МЁРТВЫЕ СТРОКИ — нужны ОБА условия, объём и доля
  # ===================================================================
  - interval: 30s
    name: "200 тыс. мёртвых при 500 тыс. живых -> предупреждение"
    input_series:
      - series: 'pg_stat_user_tables_n_dead_tup{datname="appdb",schemaname="public",relname="orders",pg_instance="db1",job="postgres-exporter"}'
        values: "200000+0x200"
      - series: 'pg_stat_user_tables_n_live_tup{datname="appdb",schemaname="public",relname="orders",pg_instance="db1",job="postgres-exporter"}'
        values: "500000+0x200"
    promql_expr_test:
      - expr: 'ALERTS{alertname="PostgresDeadTuplesHigh",alertstate="firing"}'
        eval_time: 90m
        exp_samples:
          - labels: 'ALERTS{alertname="PostgresDeadTuplesHigh", alertstate="firing", datname="appdb", job="postgres-exporter", pg_instance="db1", relname="orders", schemaname="public", severity="warning"}'
            value: 1

  - interval: 30s
    name: "200 тыс. мёртвых при 50 млн живых -> тишина, доля мала"
    input_series:
      - series: 'pg_stat_user_tables_n_dead_tup{datname="appdb",schemaname="public",relname="events",pg_instance="db1",job="postgres-exporter"}'
        values: "200000+0x200"
      - series: 'pg_stat_user_tables_n_live_tup{datname="appdb",schemaname="public",relname="events",pg_instance="db1",job="postgres-exporter"}'
        values: "50000000+0x200"
    promql_expr_test:
      - expr: 'ALERTS{alertname="PostgresDeadTuplesHigh",alertstate="firing"}'
        eval_time: 90m
        exp_samples: []

  # ===================================================================
  # ДИСК — то, ради чего нужен node_exporter
  # ===================================================================
  - interval: 30s
    name: "диск занят на 96% -> critical"
    input_series:
      - series: 'node_filesystem_avail_bytes{pg_instance="db1",job="node-exporter",mountpoint="/var/lib/postgresql",fstype="ext4"}'
        values: "4000000000+0x60"
      - series: 'node_filesystem_size_bytes{pg_instance="db1",job="node-exporter",mountpoint="/var/lib/postgresql",fstype="ext4"}'
        values: "100000000000+0x60"
    promql_expr_test:
      - expr: 'ALERTS{alertname="DiskSpaceCritical",alertstate="firing"}'
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="DiskSpaceCritical", alertstate="firing", fstype="ext4", job="node-exporter", mountpoint="/var/lib/postgresql", pg_instance="db1", severity="critical"}'
            value: 1

  - interval: 30s
    name: "диск занят на 50% -> тишина"
    input_series:
      - series: 'node_filesystem_avail_bytes{pg_instance="db1",job="node-exporter",mountpoint="/var/lib/postgresql",fstype="ext4"}'
        values: "50000000000+0x60"
      - series: 'node_filesystem_size_bytes{pg_instance="db1",job="node-exporter",mountpoint="/var/lib/postgresql",fstype="ext4"}'
        values: "100000000000+0x60"
    promql_expr_test:
      - expr: 'ALERTS{alertname=~"DiskSpace.*",alertstate="firing"}'
        eval_time: 20m
        exp_samples: []

  # tmpfs всегда почти полон и к базе отношения не имеет — фильтр
  # по fstype обязан его отсекать, иначе алерт станет шумом.
  - interval: 30s
    name: "tmpfs заполнен -> исключён фильтром, тишина"
    input_series:
      - series: 'node_filesystem_avail_bytes{pg_instance="db1",job="node-exporter",mountpoint="/run",fstype="tmpfs"}'
        values: "1000+0x60"
      - series: 'node_filesystem_size_bytes{pg_instance="db1",job="node-exporter",mountpoint="/run",fstype="tmpfs"}'
        values: "100000+0x60"
    promql_expr_test:
      - expr: 'ALERTS{alertname=~"DiskSpace.*",alertstate="firing"}'
        eval_time: 20m
        exp_samples: []
