rule_files:
  - ../../grafana/alerts-prometheus-format.yml
evaluation_interval: 30s
tests:
  - interval: 30s
    name: "база лежит"
    input_series:
      - series: 'pg_up{pg_instance="qse-dbp1-lp1",job="postgres-exporter"}'
        values: "0+0x40"
    promql_expr_test:
      - expr: 'ALERTS{alertname="БазаНеОтвечает",alertstate="firing"}'
        eval_time: 1m
        exp_samples: []
      - expr: 'count(ALERTS{alertname="БазаНеОтвечает",alertstate="firing"})'
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 1

  - interval: 30s
    name: "95 из 100 слотов -> алерт; 50 -> тишина"
    input_series:
      - series: 'pg_stat_activity_count{pg_instance="a",job="postgres-exporter",datname="d",state="idle",usename="u"}'
        values: "95+0x40"
      - series: 'pg_settings_max_connections{pg_instance="a",job="postgres-exporter"}'
        values: "100+0x40"
      - series: 'pg_stat_activity_count{pg_instance="b",job="postgres-exporter",datname="d",state="idle",usename="u"}'
        values: "50+0x40"
      - series: 'pg_settings_max_connections{pg_instance="b",job="postgres-exporter"}'
        values: "100+0x40"
    promql_expr_test:
      - expr: 'ALERTS{alertname="СлотыПодключенийНаИсходе",alertstate="firing"}'
        eval_time: 10m
        exp_samples:
          - labels: 'ALERTS{alertname="СлотыПодключенийНаИсходе", alertstate="firing", pg_instance="a", severity="critical"}'
            value: 1

  - interval: 30s
    name: "диск базы 90% -> алерт, /boot 99% -> тишина"
    input_series:
      - series: 'node_filesystem_avail_bytes{pg_instance="a",job="node-exporter",mountpoint="/data_db",fstype="xfs"}'
        values: "5361578803+0x60"
      - series: 'node_filesystem_size_bytes{pg_instance="a",job="node-exporter",mountpoint="/data_db",fstype="xfs"}'
        values: "53615788032+0x60"
      - series: 'node_filesystem_avail_bytes{pg_instance="a",job="node-exporter",mountpoint="/boot",fstype="ext4"}'
        values: "10000000+0x60"
      - series: 'node_filesystem_size_bytes{pg_instance="a",job="node-exporter",mountpoint="/boot",fstype="ext4"}'
        values: "1020702720+0x60"
    promql_expr_test:
      - expr: 'ALERTS{alertname="ДискБазыКончается",alertstate="firing"}'
        eval_time: 20m
        exp_samples:
          - labels: 'ALERTS{alertname="ДискБазыКончается", alertstate="firing", fstype="xfs", job="node-exporter", mountpoint="/data_db", pg_instance="a", severity="critical"}'
            value: 1

  - interval: 30s
    name: "транзакция 2 часа -> алерт"
    input_series:
      - series: 'pg_stat_activity_max_tx_duration{pg_instance="a",job="postgres-exporter",datname="d",state="active",usename="u"}'
        values: "7200+0x40"
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="ДолгаяТранзакция",alertstate="firing"})'
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 1

  - interval: 30s
    name: "экспортёр не отвечает -> алерт"
    input_series:
      - series: 'up{job="postgres-exporter",instance="h:9187",pg_instance="a"}'
        values: "0+0x40"
      - series: 'up{job="node-exporter",instance="h:9100",pg_instance="a"}'
        values: "1+0x40"
    promql_expr_test:
      - expr: 'count(ALERTS{alertname="МониторингОслеп",alertstate="firing"})'
        eval_time: 10m
        exp_samples:
          - labels: '{}'
            value: 1
