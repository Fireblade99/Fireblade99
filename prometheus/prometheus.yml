# =====================================================================
# Prometheus для мониторинга Postgres.
#
# Разворачивается windows/Install-Prometheus.ps1, либо руками из архива.
#
# ЦЕЛИ: два хоста БД, на каждом по два экспортёра (уже развёрнуты
# админами), плюс сам Prometheus. Итого 5 целей.
#
# Если Prometheus у вас уже есть — целиком файл не нужен, перенесите
# к себе только блок scrape_configs.
# =====================================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s        # обязан быть меньше scrape_interval
  evaluation_interval: 15s
  external_labels:
    monitor: postgres

# Базовый набор правил. Файлы из rules/optional/ подключаются ОТДЕЛЬНО
# и только после того, как появятся метрики, на которые они опираются
# (включённые коллекторы экспортёра либо запущенный пробер) — иначе
# правила молча никогда не сработают. Проверка: tools/check_targets.py
rule_files:
  - rules/*.yml

scrape_configs:

  # -------------------------------------------------------------------
  # Метка pg_instance — не косметика.
  #
  # 1. У pg-экспортёра и node-экспортёра ОДНОГО хоста она должна
  #    совпадать. По ней дашборд понимает, что вот эта база живёт на
  #    вот этом железе, и панели «диск», «память», «iowait» показывают
  #    железо именно выбранной базы. Перепутаешь — увидишь диск чужого
  #    хоста и не заметишь подвоха.
  #
  # 2. У РАЗНЫХ хостов она должна различаться — иначе их метрики
  #    склеятся в одну серию.
  #
  # 3. Каждый хост требует своего блока `- targets:`: labels действует
  #    на весь блок целиком, поэтому два хоста в одном списке получили
  #    бы одинаковую метку.
  #
  # Prometheus не подставляет переменные окружения в этот файл —
  # адреса и имена правятся руками.
  # -------------------------------------------------------------------

  - job_name: postgres-exporter
    static_configs:
      - targets: ["ЗАМЕНИТЬ-ХОСТ-1:9187"]
        labels:
          pg_instance: "db01"
      - targets: ["ЗАМЕНИТЬ-ХОСТ-2:9187"]
        labels:
          pg_instance: "db02"
    # Если админы включили basic auth на экспортёрах:
    # basic_auth:
    #   username: prometheus
    #   password_file: /etc/prometheus/exporter_password

  - job_name: node-exporter
    static_configs:
      - targets: ["ЗАМЕНИТЬ-ХОСТ-1:9100"]
        labels:
          pg_instance: "db01"
      - targets: ["ЗАМЕНИТЬ-ХОСТ-2:9100"]
        labels:
          pg_instance: "db02"

  # Сам Prometheus — чтобы заметить, если мониторинг сломался.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Пробер времени отклика. Раскомментировать, только если он запущен
  # (windows/Install-PgProbe.ps1). Его метрики нужны алертам из
  # rules/optional/postgres.alerts-probe.yml.
  # - job_name: pg-probe
  #   static_configs:
  #     - targets: ["127.0.0.1:9899"]
  #       labels:
  #         pg_instance: "db01"
