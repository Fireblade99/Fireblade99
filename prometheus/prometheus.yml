# =====================================================================
# Prometheus: мониторинг Postgres на нескольких хостах.
#
# На каждом хосте работают два экспортёра, развёрнутые админами:
#   postgres_exporter  :9187
#   node_exporter      :9100
#
# Здесь только опрос. Ставить на хосты ничего не нужно.
# =====================================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s        # обязан быть меньше scrape_interval
  evaluation_interval: 15s
  external_labels:
    monitor: postgres

rule_files:
  - rules/*.yml

# ---------------------------------------------------------------------
# ДВЕ МЕТКИ, НА КОТОРЫХ ВСЁ ДЕРЖИТСЯ
#
# pg_instance — какой хост. Выводится ИЗ АДРЕСА автоматически, через
#   relabel_configs. Руками не пишется. Смысл: у портов 9187 и 9100
#   одного хоста метка обязана совпадать, иначе дашборд не свяжет базу
#   с её железом и панели диска покажут чужую машину — молча. При ручном
#   вводе на восьми хостах ошибиться в одной букве слишком легко.
#
# pg_group — к какой группе относится. Задаётся руками, потому что из
#   адреса её не вывести. Разделяет дашборды и алерты между наборами
#   хостов: каждая группа видит только свои.
#
# ДОБАВИТЬ ХОСТ = дописать адрес в нужный список targets. Больше
# ничего. Появится в своём дашборде и под своими алертами сам.
# ---------------------------------------------------------------------

scrape_configs:

  - job_name: postgres-exporter
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+)(?::\d+)?'
        target_label: pg_instance
        replacement: '${1}'
    static_configs:
      - targets:
          - "qse-dbp1-lp1:9187"
          - "qse-dbp2-lp2:9187"
        labels:
          pg_group: "qse"
      - targets:
          - "ЗАМЕНИТЬ-ХОСТ-3:9187"
          - "ЗАМЕНИТЬ-ХОСТ-4:9187"
          - "ЗАМЕНИТЬ-ХОСТ-5:9187"
          - "ЗАМЕНИТЬ-ХОСТ-6:9187"
        labels:
          pg_group: "prod2"

  - job_name: node-exporter
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+)(?::\d+)?'
        target_label: pg_instance
        replacement: '${1}'
    static_configs:
      - targets:
          - "qse-dbp1-lp1:9100"
          - "qse-dbp2-lp2:9100"
        labels:
          pg_group: "qse"
      - targets:
          - "ЗАМЕНИТЬ-ХОСТ-3:9100"
          - "ЗАМЕНИТЬ-ХОСТ-4:9100"
          - "ЗАМЕНИТЬ-ХОСТ-5:9100"
          - "ЗАМЕНИТЬ-ХОСТ-6:9100"
        labels:
          pg_group: "prod2"

  # Сам Prometheus — чтобы заметить, если мониторинг сломался.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:19090"]
