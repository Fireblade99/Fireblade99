# =====================================================================
# Prometheus для мониторинга удалённого Postgres.
#
# Если Prometheus у вас уже есть — целиком этот файл не нужен,
# перенесите к себе только scrape_configs и rule_files.
# =====================================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s        # обязан быть меньше scrape_interval
  evaluation_interval: 15s
  external_labels:
    monitor: postgres

rule_files:
  # Базовый набор: работает с postgres_exporter 0.17.1 и node_exporter
  # в конфигурации по умолчанию. Ничего включать не нужно.
  - rules/*.yml

  # Дополнительные наборы подключать ТОЛЬКО после того, как появятся
  # нужные метрики, иначе правила молча никогда не сработают.
  # Проверить: python3 tools/check_targets.py
  #
  # После включения коллекторов экспортёра
  # (--collector.database_wraparound, --collector.postmaster,
  #  --collector.replication_slot, --collector.stat_statements):
  # - rules/optional/postgres.alerts-collectors.yml
  #
  # Если запущен пробер (windows/Install-PgProbe.ps1):
  # - rules/optional/postgres.alerts-probe.yml

scrape_configs:

  # -------------------------------------------------------------------
  # ВАЖНО: метка pg_instance должна быть ОДИНАКОВОЙ во всех job.
  # По ней дашборд и правила связывают метрики из разных источников.
  # Prometheus не подставляет переменные окружения в этот файл —
  # адреса правьте руками.
  # -------------------------------------------------------------------

  - job_name: postgres-exporter
    static_configs:
      - targets: ["ЗАМЕНИТЬ-НА-АДРЕС-ХОСТА-БД:9187"]
        labels:
          pg_instance: "prod-postgres"
    # Если на экспортёре включён basic auth:
    # basic_auth:
    #   username: prometheus
    #   password_file: /etc/prometheus/exporter_password

  - job_name: node-exporter
    static_configs:
      - targets: ["ЗАМЕНИТЬ-НА-АДРЕС-ХОСТА-БД:9100"]
        labels:
          pg_instance: "prod-postgres"

  # Пробер — ОПЦИОНАЛЬНО, только если разворачивали его отдельно.
  # Он единственный меряет время отклика: экспортёр живёт на хосте БД
  # и путь по сети не видит по определению.
  # - job_name: pg-probe
  #   static_configs:
  #     - targets: ["127.0.0.1:9899"]
  #       labels:
  #         pg_instance: "prod-postgres"

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
