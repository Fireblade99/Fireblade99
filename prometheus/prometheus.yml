# =====================================================================
# Prometheus: опрос экспортёров Postgres.
#
# На каждом хосте работают postgres_exporter (:9187) и node_exporter
# (:9100), развёрнутые админами. Здесь только сбор — ставить на хосты
# ничего не нужно.
#
# Правила алертов сюда НЕ подключаются: алерты живут в Grafana
# Alerting, ей Prometheus нужен только как источник данных.
# =====================================================================

global:
  scrape_interval: 15s
  scrape_timeout: 10s        # обязан быть меньше scrape_interval

# ---------------------------------------------------------------------
# ДВЕ МЕТКИ, НА КОТОРЫХ ДЕРЖАТСЯ ДАШБОРДЫ
#
# pg_instance — какой хост. Выводится ИЗ АДРЕСА автоматически, через
#   relabel_configs ниже. Руками больше не пишется.
#
#   Зачем так: метка обязана СОВПАДАТЬ у портов 9187 и 9100 одного
#   хоста — по ней дашборд связывает базу с её железом. Разойдутся —
#   панели диска и памяти покажут чужую машину, и никто об этом не
#   сообщит. При выводе из адреса они совпадают по построению.
#
# pg_group — к какой группе относится хост. Задаётся руками, из адреса
#   её не вывести. Делит дашборды и алерты между наборами хостов:
#   каждая группа видит только свои.
#
# ДОБАВИТЬ ХОСТ = дописать адрес в нужный список targets, и то же самое
# в node-exporter с портом 9100. Больше ничего.
# ---------------------------------------------------------------------

scrape_configs:

  - job_name: postgres-exporter
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+)(?::\d+)?'
        target_label: pg_instance
        replacement: '${1}'
    static_configs:
      - targets:
          - "qse-dbp1-lp1:9187"
          - "qse-dbp2-lp2:9187"
        labels:
          pg_group: "qse"

      # Группа prod-airflow. Впиши адреса — имя группы уже проставлено
      # оно попадёт в переменную pg_group второго дашборда.
      # - targets:
      #     - "ХОСТ-3:9187"
      #     - "ХОСТ-4:9187"
      #     - "ХОСТ-5:9187"
      #     - "ХОСТ-6:9187"
      #   labels:
      #     pg_group: "prod-airflow"

  - job_name: node-exporter
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+)(?::\d+)?'
        target_label: pg_instance
        replacement: '${1}'
    static_configs:
      - targets:
          - "qse-dbp1-lp1:9100"
          - "qse-dbp2-lp2:9100"
        labels:
          pg_group: "qse"

      # - targets:
      #     - "ХОСТ-3:9100"
      #     - "ХОСТ-4:9100"
      #     - "ХОСТ-5:9100"
      #     - "ХОСТ-6:9100"
      #   labels:
      #     pg_group: "prod-airflow"

  # Сам Prometheus — чтобы заметить, если мониторинг сломался.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:19090"]
