# =====================================================================
# Recording rules — база.
#
# Опирается ТОЛЬКО на то, что ваши экспортёры отдают СЕЙЧАС:
#   postgres_exporter 0.17.1 с настройками по умолчанию
#   node_exporter (полный набор коллекторов)
#
# Всё, что требует включения дополнительных коллекторов или пробера,
# вынесено в rules/optional/ — чтобы не было правил, которые молча
# никогда не сработают.
# =====================================================================
groups:
  - name: postgres.recording
    interval: 30s
    rules:

      # --- насыщение по коннектам ---------------------------------
      # pg_stat_activity_count разбит по datname/state/usename/
      # application_name, поэтому суммируем.
      - record: pg:connections:used
        expr: |
          sum by (pg_instance) (pg_stat_activity_count)

      - record: pg:connections:utilization
        expr: |
          sum by (pg_instance) (pg_stat_activity_count)
          /
          max by (pg_instance) (pg_settings_max_connections)

      # --- эффективность ------------------------------------------
      # Считается по rate(), а не по накопленной сумме: иначе значение
      # намертво определялось бы историей с момента запуска базы.
      #
      # Деление НАМЕРЕННО без clamp_min. На простаивающей базе оба
      # счётчика стоят, 0/0 даёт NaN — и это правильный ответ:
      # «трафика не было, отношение не определено». Подставь туда
      # единицу — вышел бы ровный ноль, неотличимый от катастрофы, и
      # алерт «< 95%» будил бы всю ночь на пустой базе. NaN не проходит
      # сравнение, поэтому алерт молчит сам собой, а на графике честно
      # получается разрыв вместо выдуманного нуля.
      - record: pg:cache:hit_ratio
        expr: |
          sum by (pg_instance) (rate(pg_stat_database_blks_hit[15m]))
          /
          (
            sum by (pg_instance) (rate(pg_stat_database_blks_hit[15m]))
            + sum by (pg_instance) (rate(pg_stat_database_blks_read[15m]))
          )

      - record: pg:transactions:rollback_ratio
        expr: |
          sum by (pg_instance) (rate(pg_stat_database_xact_rollback[15m]))
          /
          (
            sum by (pg_instance) (rate(pg_stat_database_xact_commit[15m]))
            + sum by (pg_instance) (rate(pg_stat_database_xact_rollback[15m]))
          )

      - record: pg:transactions:rate
        expr: |
          sum by (pg_instance) (rate(pg_stat_database_xact_commit[5m]))
          + sum by (pg_instance) (rate(pg_stat_database_xact_rollback[5m]))

      # --- диск на хосте БД ---------------------------------------
      # Фильтр по mountpoint, а не «всё кроме tmpfs». На этом хосте
      # десяток файловых систем (/boot, /var/log/audit, /home ...), и
      # общий фильтр давал бы алерты, к базе отношения не имеющие.
      #
      # ЕСЛИ РАСКЛАДКА ДРУГАЯ — правится здесь, в одном месте:
      #   /data_db  данные (PGDATA)
      #   /mwal     WAL
      #   /pg_log   логи Postgres
      - record: host:pgfilesystem:used_ratio
        expr: |
          1 - (
            node_filesystem_avail_bytes{mountpoint=~"/data_db|/mwal|/pg_log"}
            /
            node_filesystem_size_bytes{mountpoint=~"/data_db|/mwal|/pg_log"}
          )

      # Отдельно — доступные байты, для предсказания заполнения.
      - record: host:pgfilesystem:avail_bytes
        expr: |
          node_filesystem_avail_bytes{mountpoint=~"/data_db|/mwal|/pg_log"}
