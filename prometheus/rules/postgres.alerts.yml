# =====================================================================
# Алерты по Postgres — БАЗОВЫЙ набор.
#
# Работает с вашей конфигурацией КАК ЕСТЬ:
#   postgres_exporter 0.17.1, коллекторы по умолчанию
#   node_exporter, полный набор
#   PostgreSQL 14.2
#
# Ничего включать и никого просить не нужно. Дополнительные алерты,
# требующие включения коллекторов или пробера, лежат в rules/optional/
# и подключаются отдельно — так не бывает правил, которые молча
# никогда не срабатывают.
#
# severity: critical — отказ или деградация сейчас, будить ночью
#           warning  — тенденция, разбираться в рабочее время
#
# `for` не для красоты: без него одиночный сетевой чих даст ложную
# побудку.
# =====================================================================
groups:

  # ===================================================================
  # ДОСТУПНОСТЬ
  # ===================================================================
  - name: postgres.availability
    rules:

      - alert: PostgresDown
        expr: pg_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Postgres не отвечает ({{ $labels.pg_instance }})"
          description: >-
            Экспортёр работает на самом хосте БД и не может подключиться
            к Postgres. Значит проблема в базе, а не в сети до неё.

      # Мониторинг, который молча умер, хуже отсутствующего.
      - alert: MonitoringTargetDown
        expr: up{job=~"postgres-exporter|node-exporter"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Сборщик метрик не отвечает: {{ $labels.job }}"
          description: >-
            Prometheus не может опросить {{ $labels.instance }}. Пока это
            так, часть алертов по базе слепа.

  # ===================================================================
  # НАСЫЩЕНИЕ
  # ===================================================================
  - name: postgres.saturation
    rules:

      - alert: PostgresConnectionsHigh
        expr: pg:connections:utilization > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Занято {{ $value | humanizePercentage }} слотов подключений"
          description: >-
            Приближаемся к max_connections. Когда слоты кончатся, новые
            клиенты начнут получать отказ — база при этом останется
            «живой», и pg_up ничего не заметит.

      - alert: PostgresConnectionsCritical
        expr: pg:connections:utilization > 0.9
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Слоты подключений почти кончились: {{ $value | humanizePercentage }}"
          description: >-
            Осталось меньше 10% от max_connections. Кто именно съел —
            видно в pg_stat_activity_count: он разбит по usename и
            application_name.

      # Классический баг приложения: транзакция открыта и забыта. Такая
      # сессия держит снимок данных и блокирует очистку мёртвых строк
      # ВО ВСЕЙ базе, не только в своей таблице.
      - alert: PostgresIdleInTransaction
        expr: pg_stat_activity_max_tx_duration{state="idle in transaction"} > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Сессия висит в idle in transaction {{ $value | humanizeDuration }}"
          description: >-
            Приложение {{ $labels.application_name }} (пользователь
            {{ $labels.usename }}, база {{ $labels.datname }}) открыло
            транзакцию и не закрыло. Найти:
            SELECT pid, usename, state_change, query FROM pg_stat_activity
            WHERE state = 'idle in transaction' ORDER BY state_change;

      - alert: PostgresLongTransaction
        expr: max by (pg_instance, datname) (pg_stat_activity_max_tx_duration) > 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Транзакция в {{ $labels.datname }} открыта больше часа"
          description: >-
            {{ $value | humanizeDuration }}. Долгая транзакция удерживает
            старые версии строк и не даёт вакууму работать. Если это
            регулярный отчёт — вынеси его на реплику.

  # ===================================================================
  # ДИСКИ — здесь самое ценное, что даёт node_exporter.
  # Изнутри Postgres свободное место не видно в принципе, а
  # переполнение тома останавливает запись мгновенно.
  # ===================================================================
  - name: postgres.disk
    rules:

      # Данные и WAL — отказ базы. Логи — потеря логов, неприятно,
      # но база живёт. Поэтому разная критичность.
      - alert: PostgresDiskCritical
        expr: host:pgfilesystem:used_ratio{mountpoint=~"/data_db|/mwal"} > 0.90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.mountpoint }} занят на {{ $value | humanizePercentage }}"
          description: >-
            При заполнении этого тома Postgres прекращает приём записи.
            Это не деградация, а остановка. /data_db — данные,
            /mwal — WAL.

      - alert: PostgresDiskLow
        expr: host:pgfilesystem:used_ratio{mountpoint=~"/data_db|/mwal"} > 0.80
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} занят на {{ $value | humanizePercentage }}"
          description: >-
            Осталось меньше 20%. Для /mwal обычная причина — застрявший
            слот репликации или сломанный archive_command: Postgres не
            может удалять WAL и копит его. Для /data_db — распухание
            таблиц или рост данных.

      - alert: PostgresLogDiskLow
        expr: host:pgfilesystem:used_ratio{mountpoint="/pg_log"} > 0.85
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Том с логами Postgres занят на {{ $value | humanizePercentage }}"
          description: >-
            База продолжит работать, но логи писаться перестанут — и
            разбирать следующий инцидент будет нечем. Проверь ротацию
            (log_rotation_age, log_rotation_size) и не включён ли
            случайно log_statement = all.

      # Предсказание важнее факта: место кончается предсказуемо, и
      # предупреждение за сутки даёт время среагировать по-человечески,
      # а не ночью по факту остановки.
      # Второе условие гасит шум линейного тренда на почти пустом томе.
      - alert: PostgresDiskWillFillIn24h
        expr: |
          predict_linear(host:pgfilesystem:avail_bytes{mountpoint=~"/data_db|/mwal"}[6h], 24 * 3600) < 0
          and host:pgfilesystem:used_ratio{mountpoint=~"/data_db|/mwal"} > 0.6
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.mountpoint }} кончится в ближайшие сутки"
          description: >-
            По тренду за последние 6 часов свободное место закончится
            менее чем за 24 часа. Это предупреждение заранее —
            реагировать можно спокойно.

  # ===================================================================
  # ХОСТ
  # ===================================================================
  - name: postgres.host
    rules:

      - alert: HostMemoryLow
        expr: |
          node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "На хосте БД осталось {{ $value | humanizePercentage }} памяти"
          description: >-
            Postgres при нехватке активнее ходит на диск, а в худшем
            случае OOM killer прибьёт backend и база уйдёт в аварийное
            восстановление.

      # Прямое доказательство того, что предыдущий алерт предсказывал.
      # Убитый backend роняет ВСЮ базу в recovery, а не только себя.
      - alert: HostOOMKill
        expr: increase(node_vmstat_oom_kill[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "OOM killer убил процесс на хосте БД"
          description: >-
            Если жертвой стал backend Postgres, база принудительно
            завершает все соединения и уходит в аварийное
            восстановление. Смотри dmesg и логи базы.

      - alert: HostHighIOWait
        expr: |
          avg by (pg_instance, instance) (rate(node_cpu_seconds_total{mode="iowait"}[10m])) > 0.25
        for: 20m
        labels:
          severity: warning
        annotations:
          summary: "Хост БД четверть времени ждёт диск ({{ $value | humanizePercentage }} iowait)"
          description: >-
            Диск не успевает за нагрузкой. Сопоставь с временем отклика:
            если оно тоже выросло, причина найдена.

      # Postgres открывает много файлов: по файлу на таблицу и индекс,
      # плюс сегменты. Упереться в лимит — это отказ на ровном месте.
      - alert: HostFileDescriptorsHigh
        expr: node_filefd_allocated / node_filefd_maximum > 0.8
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Занято {{ $value | humanizePercentage }} файловых дескрипторов"
          description: >-
            Postgres держит по дескриптору на каждый открытый файл
            отношения. При исчерпании лимита операции начнут падать
            с «Too many open files».

  # ===================================================================
  # ЭФФЕКТИВНОСТЬ — не аварии, но отсюда растут будущие
  # ===================================================================
  - name: postgres.efficiency
    rules:

      - alert: PostgresLowCacheHitRatio
        expr: pg:cache:hit_ratio < 0.95
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Попаданий в кэш только {{ $value | humanizePercentage }}"
          description: >-
            База регулярно ходит мимо shared_buffers. Либо его мало,
            либо рабочий набор перерос память, либо кто-то делает полные
            сканы вместо индексных.

      - alert: PostgresHighRollbackRatio
        expr: pg:transactions:rollback_ratio > 0.1
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Откатывается {{ $value | humanizePercentage }} транзакций"
          description: >-
            Каждая десятая транзакция завершается откатом. Обычно ошибки
            в приложении, реже — нарушения ограничений или таймауты.

      - alert: PostgresDeadlocks
        expr: increase(pg_stat_database_deadlocks[30m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Взаимоблокировки в базе {{ $labels.datname }}: {{ $value }} за 30 минут"
          description: >-
            Postgres разорвал взаимоблокировку, убив одну из транзакций.
            Для приложения это потерянная работа.

      # Временные файлы = запросу не хватило work_mem и он пошёл
      # сортировать на диск. Это на порядки медленнее.
      - alert: PostgresTempFileSpike
        expr: rate(pg_stat_database_temp_bytes[30m]) > 10485760
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Временные файлы {{ $value | humanize1024 }}B/с в базе {{ $labels.datname }}"
          description: >-
            Запросам не хватает work_mem, сортировки и хэши уходят на
            диск. Либо поднять work_mem, либо чинить запросы.

      # Досрочные чекпоинты — признак, что база не успевает за записью.
      # На PG14 это pg_stat_bgwriter (в PG17 счётчики уехали в
      # pg_stat_checkpointer — при апгрейде правило надо будет менять).
      - alert: PostgresForcedCheckpoints
        expr: rate(pg_stat_bgwriter_checkpoints_req_total[1h])
              > rate(pg_stat_bgwriter_checkpoints_timed_total[1h])
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Чекпоинты идут досрочно, по переполнению WAL"
          description: >-
            Досрочных чекпоинтов больше, чем плановых: max_wal_size мал
            для текущей нагрузки на запись. Следствие — всплески
            дисковой записи и просадки времени отклика.

  # ===================================================================
  # РЕПЛИКАЦИЯ И АРХИВАЦИЯ
  # ===================================================================
  - name: postgres.replication
    rules:

      - alert: PostgresReplicationLag
        expr: pg_replication_lag_seconds > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Отставание репликации {{ $value | humanizeDuration }}"
          description: >-
            Если с реплики читают — читают устаревшие данные. Если она
            резервная — окно потери данных при аварии равно этому
            отставанию.

      # Сломанный archive_command копит WAL на /mwal до заполнения тома.
      - alert: PostgresArchiverFailing
        expr: increase(pg_stat_archiver_failed_count[1h]) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Архивация WAL падает ({{ $value }} ошибок за час)"
          description: >-
            archive_command возвращает ошибку. Postgres будет копить
            неархивированный WAL на /mwal, пока команда не заработает
            или том не кончится.
